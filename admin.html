<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin CMS | The Civil Media</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login"><div class="loginbox"><img src="assets/logo.jpeg"><h1>The Civil Media</h1><p>Newsroom CMS</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Sign In</button><small>Use the administrator credentials configured on the server.</small><a href="/">← Website</a></div></div>
<div id="cms" class="hidden"><aside><img src="assets/logo.jpeg"><h2>THE CIVIL MEDIA</h2><span id="who"></span><button onclick="tab('dashboard')">Dashboard</button><button onclick="tab('articles')">Articles</button><button onclick="newArticle()">+ Add News</button><button onclick="tab('audit')">Audit Log</button><button id="usersBtn" onclick="tab('users')">Users</button><button id="settingsBtn" onclick="tab('settings')">Settings</button><a href="/">View Website ↗</a><button onclick="logout()">Logout</button></aside>
<main>
<section id="dashboard"><h1>Dashboard</h1><div class="stats"><div><b id="c">0</b>Total</div><div><b id="pub">0</b>Published</div><div><b id="dr">0</b>Drafts</div><div><b id="ar">0</b>Archived</div><div><b id="ft">0</b>Featured</div></div><div id="recent"></div></section>
<section id="articles" class="hidden"><div class="title"><h1>Articles</h1><button onclick="newArticle()">+ Add News</button></div><input class="full" id="q" placeholder="Search articles..." oninput="renderArticles()"><div id="table"></div></section>
<section id="editor" class="hidden"><h1 id="et">Add News</h1><form onsubmit="saveArticle(event)"><input type="hidden" id="id"><label>Headline (English)<input id="title_en" required></label><label>Headline (Nepali)<input id="title_np" placeholder="शीर्षक"></label><div class="two"><label>Category<select id="cat"><option>Nepal</option><option>Politics</option><option>Business</option><option>World</option><option>Sports</option><option>Entertainment</option><option>Technology</option><option>Opinion</option></select></label><label>Status<select id="status"><option>Published</option><option>Draft</option></select></label></div><label>Summary (English)<textarea id="summary_en" required></textarea></label><label>Summary (Nepali)<textarea id="summary_np"></textarea></label><label>Full Article (English)<textarea id="content_en" required></textarea></label><label>Full Article (Nepali)<textarea id="content_np"></textarea></label><label><input type="checkbox" id="featured"> Feature on homepage</label><label>Image URL<input id="image"></label><label>Or upload image<input type="file" id="file" accept="image/*"></label><button>Save Article</button></form></section>
<section id="audit" class="hidden"><h1>Audit Log</h1><div id="logs"></div></section>
<section id="users" class="hidden"><h1>Users</h1><form onsubmit="addUser(event)"><div class="two"><label>Username<input id="nu" required></label><label>Password<input id="npw" type="password" required></label></div><label>Role<select id="role"><option>editor</option><option>admin</option></select></label><button>Add User</button></form><div id="userlist"></div></section>
<section id="settings" class="hidden"><h1>Website Settings</h1><form onsubmit="saveSettings(event)"><label>Company Name<input id="company"></label><label>Tagline<input id="tagline"></label><label>Location<input id="location"></label><label>Email<input id="email"></label><label>Phone<input id="phone"></label><label>Facebook URL<input id="facebook"></label><label>YouTube URL<input id="youtube"></label><label>TikTok URL<input id="tiktok"></label><label>X URL<input id="x"></label><label><input type="checkbox" id="ads"> Enable advertisement spaces</label><button>Save Settings</button></form></section>
</main></div><script src="admin.js"></script></body></html>
